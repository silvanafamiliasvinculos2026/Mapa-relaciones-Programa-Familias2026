<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Relaciones Familias 2026 - Villarrica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- Encabezado -->
  <header class="bg-slate-900 text-white border-b border-slate-800 shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg">
          <i class="fa-solid fa-sitemap text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Mapa de Relaciones Familias 2026</h1>
          <p class="text-slate-400 text-xs">Red de Servicios y Oficinas Municipales - Comuna de Villarrica</p>
        </div>
      </div>

      <!-- Buscador -->
      <div class="w-full md:w-96 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="Buscar oficina, encargado, dirección, área..." 
          class="w-full pl-9 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </header>

  <!-- Filtros por Área -->
  <nav class="bg-white border-b border-slate-200 shadow-xs sticky top-[73px] z-40">
    <div id="areaFilters" class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap gap-2"></div>
  </nav>

  <!-- Grilla principal -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-4">
      <p id="resultsCounter" class="text-xs font-semibold text-slate-500 uppercase tracking-wider"></p>
    </div>
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <script>
    let allData = [];
    let activeArea = 'TODAS';

    const areaStyles = {
      'Educación': 'bg-blue-600 text-white',
      'Vivienda': 'bg-pink-600 text-white',
      'OMJ': 'bg-indigo-600 text-white',
      'Infancia': 'bg-amber-500 text-white',
      'Salud': 'bg-cyan-600 text-white',
      'Inclusión y Protección Social': 'bg-emerald-600 text-white',
      'Capacitación Laboral': 'bg-orange-600 text-white',
      'Deportes': 'bg-lime-600 text-white',
      'Comunidad Indígena': 'bg-teal-700 text-white',
      'Persona Mayor': 'bg-purple-600 text-white',
      'Medio Ambiente y Gestión de Riesgos': 'bg-green-700 text-white'
    };

    fetch('datos.json')
      .then(res => res.json())
      .then(data => {
        allData = data;
        buildFilterButtons();
        renderData();
      });

    function buildFilterButtons() {
      const container = document.getElementById('areaFilters');
      const areas = ['TODAS', ...new Set(allData.map(item => item.area))];

      container.innerHTML = areas.map(area => {
        const isAll = area === 'TODAS';
        const label = isAll ? 'Todas las Áreas' : area;
        const baseClass = isAll
          ? 'area-btn bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition'
          : 'area-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition';
        return `<button onclick="filterArea('${area}', this)" class="${baseClass}">${label}</button>`;
      }).join('');
    }

    function filterArea(area, btn) {
      activeArea = area;
      document.querySelectorAll('.area-btn').forEach(b => {
        b.className = 'area-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition';
      });
      btn.className = 'area-btn bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition';
      renderData();
    }

    function renderData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('cardsGrid');
      const counter = document.getElementById('resultsCounter');
      grid.innerHTML = '';

      const filtered = allData.filter(item => {
        const matchArea = activeArea === 'TODAS' || item.area === activeArea;
        const matchSearch =
          item.oficina.toLowerCase().includes(search) ||
          item.area.toLowerCase().includes(search) ||
          item.encargado.toLowerCase().includes(search) ||
          item.contacto.toLowerCase().includes(search) ||
          item.horario.toLowerCase().includes(search) ||
          item.direccion.toLowerCase().includes(search);
        return matchArea && matchSearch;
      });

      counter.textContent = `Mostrando ${filtered.length} de ${allData.length} oficinas`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">
          <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
          <p class="font-medium">No se encontraron oficinas con esa búsqueda.</p>
        </div>`;
        return;
      }

      filtered.forEach(item => {
        const badgeClass = areaStyles[item.area] || 'bg-slate-700 text-white';
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-slate-200 p-5 shadow-xs hover:shadow-md transition-shadow flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-3">
              <span class="px-2.5 py-1 rounded text-xs font-bold uppercase ${badgeClass}">
                ${item.area}
              </span>
              <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-semibold border border-slate-200 shrink-0">
                N° ${item.numero}
              </span>
            </div>
            <h3 class="font-bold text-slate-900 text-base mb-2 leading-snug">${item.oficina}</h3>
            ${item.encargado ? `
              <p class="text-xs text-blue-700 font-semibold mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-user-tie"></i> Encargado(a): ${item.encargado}
              </p>` : ''}
          </div>

          <div class="space-y-2 text-xs border-t border-slate-100 pt-3 bg-slate-50 -mx-5 -mb-5 p-4 rounded-b-xl">
            ${item.direccion ? `<p class="text-slate-700"><strong><i class="fa-solid fa-location-dot text-slate-400 mr-1.5"></i>Ubicación:</strong> ${item.direccion}</p>` : ''}
            ${item.horario ? `<p class="text-slate-700"><strong><i class="fa-regular fa-clock text-slate-400 mr-1.5"></i>Horario:</strong> ${item.horario}</p>` : ''}
            ${item.contacto ? `<p class="text-slate-700 break-words"><strong><i class="fa-solid fa-phone text-slate-400 mr-1.5"></i>Contacto:</strong> ${item.contacto}</p>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderData);
  </script>
</body>
</html>
